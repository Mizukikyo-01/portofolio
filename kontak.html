<body>
     <header>
       <div class="container navbar">
        <h1>Miftah Adnan Sujadi</h1>
        <nav>
          <ul>
             <li><a href="index.html"><Beranda">Beranda</a></li>
             <li><a href="proyek.html"><Proyek">Proyek</a></li>
             <li><a href="kontak.html"><Kontak">Kontak</a></li>
         </ul>

    <main>
      <div class="container">
        <section class="kartu">
            <h2>Hubungi Saya</h2>
            <p>Punya pertanyaan atau bekerja sama</p>
        </Section>

        <section class="kartu">
            <p>
                <label for="nama">Nama (text)</label><br>
                <input type="nama"  id="nama" name="nama" required>
            </p>
            <p>
                <label for="email">Email (text)</label><br>
                <input type="email"  id="email" name="email" required>
            </p>
            <p>
                <label for="hp">Nomor hp (tel)</label><br>
                <input type="tel"  id="hp" name="hp" required>
            </p>
            <p>
                <label for="umur">Umur (number)</label><br>
                <input type="number"  id="umur" name="umur" required>
            </p>
            <p>
                <label for="lahir">Tanggal lahir (date)</label><br>
                <input type="date"  id="lahir" name="lahir" required>
            </p>
        </section>

        <section class="kartu">
            <select id="keperluan" name="keperluan" required>
              <option value="">-- Pilih keperluan --</option>
              <option value="bertanya">Bertanya</option>
              <option value="kerja-sama">Kerja sama proyek</option>
              <option value="lainnya">Lainnya</option>
            </select>
        </section>

        <section class="kartu">
            <textarea id="pesan" name="pesan" rows="5" cols="40"
            placeholder="Tulis pesan anda disini" required></textarea>
        </section>

        <section class="kartu">
            <form>
              <p>
                <label for="nama">Nama lengkap</label><br>
                <input type="text" id="nama" name="nama" placeholder="Contoh:
        yukikentang" required>
            </p>
            <button type="submit">Kirim Pesan</button>
            </form>
       </div>
        </section>
    </main>
